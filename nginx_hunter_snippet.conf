    # ============================================================
    # Public Config Distribution Endpoints (no auth required)
    # ============================================================
    location /myconfigs/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:7800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
        proxy_send_timeout 30;
    }

    # ============================================================
    # Hunter Censorship Monitor UI (api.abharcable.com/myaddresses/mon/)
    # ============================================================

    # Proxy Gateway API - session management and status
    location /myaddresses/mon/api/gateway/ {
        auth_basic 'Hunter Monitor';
        auth_basic_user_file /etc/nginx/.htpasswd_hunter;
        proxy_pass http://127.0.0.1:7805;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    # Proxy Gateway CONNECT tunnel - for HTTPS proxying
    location /myaddresses/mon/gateway {
        auth_basic 'Hunter Monitor';
        auth_basic_user_file /etc/nginx/.htpasswd_hunter;
        proxy_pass http://127.0.0.1:7805;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
        proxy_cache off;
    }

    location /myaddresses/mon/ws-status {
