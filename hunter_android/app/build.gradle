apply plugin: 'com.android.application'

android {
    namespace 'com.hunter.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.hunter.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"

        // ARM64 only — real Android phones. x86_64 is emulators-only.
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -frtti'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    signingConfigs {
        release {
            // Default: use debug keystore so `gradle assembleRelease` works out
            // of the box. For distribution, generate a real keystore:
            //   keytool -genkeypair -v -keystore hunter.keystore \
            //     -alias hunter -keyalg RSA -keysize 2048 -validity 10000
            // Then set these env vars before building:
            //   HUNTER_KEYSTORE=path/to/hunter.keystore
            //   HUNTER_KEYSTORE_PASSWORD=...
            //   HUNTER_KEY_ALIAS=hunter
            //   HUNTER_KEY_PASSWORD=...
            def ks = System.env.HUNTER_KEYSTORE
            if (ks != null && new File(ks).exists()) {
                storeFile file(ks)
                storePassword System.env.HUNTER_KEYSTORE_PASSWORD
                keyAlias System.env.HUNTER_KEY_ALIAS
                keyPassword System.env.HUNTER_KEY_PASSWORD
            } else {
                // Fall back to debug keystore (auto-generated by Android SDK).
                storeFile new File(System.getProperty('user.home'), '.android/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            // Enable v1+v2+v3 signing for maximum device compatibility.
            // v2/v3 is required for Android 7+ and recommended for all.
            // Disable lint vital checks — they download a 30MB IntelliJ jar
            // and are not required for the APK to install/run.
            lint {
                checkReleaseBuilds false
                abortOnError false
            }
        }
        debug {
            // Debug uses its own default signing.
        }
    }

    // Globally disable lint — not needed for a native C++ app.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // Engine binaries in assets/ must not be compressed by the APK builder
    // so they can be directly extracted and executed without decompression.
    // Files with no extension: specify the bare names.
    // configs.zst is already zstd-compressed — don't let the packer re-compress.
    androidResources {
        noCompress 'xray', 'sing-box', 'zst'
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Pack native libs uncompressed in APK (extractNativeLibs=false).
    // This allows the system to mmap them directly from the APK.
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    // Ensure the APK is built with the correct ABI split.
    splits {
        abi {
            enable false  // Single APK with arm64-v8a only
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
