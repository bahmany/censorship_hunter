apply plugin: 'com.android.application'

android {
    namespace 'com.hunter.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.hunter.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"

        // ARM64 only — real Android phones. x86_64 is emulators-only.
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -frtti'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    // Release signing comes ONLY from environment variables; there is no debug-key fallback.
    //   HUNTER_KEYSTORE, HUNTER_KEYSTORE_PASSWORD, HUNTER_KEY_ALIAS, HUNTER_KEY_PASSWORD
    def releaseKs = System.getenv('HUNTER_KEYSTORE')
    def hasReleaseKey = releaseKs != null && new File(releaseKs).exists()
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(releaseKs)
                storePassword System.getenv('HUNTER_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HUNTER_KEY_ALIAS')
                keyPassword System.getenv('HUNTER_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }   // else: unsigned release APK (never debug-signed)
            // Enable v1+v2+v3 signing for maximum device compatibility.
            // v2/v3 is required for Android 7+ and recommended for all.
            // Disable lint vital checks — they download a 30MB IntelliJ jar
            // and are not required for the APK to install/run.
            lint {
                checkReleaseBuilds false
                abortOnError false
            }
        }
        debug {
            // Debug uses its own default signing.
        }
    }

    // Globally disable lint — not needed for a native C++ app.
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // Engine binaries in assets/ must not be compressed by the APK builder
    // so they can be directly extracted and executed without decompression.
    // Files with no extension: specify the bare names.
    // configs.zst is already zstd-compressed — don't let the packer re-compress.
    androidResources {
        noCompress 'zst'
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Engines (libxray.so / libsingbox.so) are executables: they MUST be extracted to
    // nativeLibraryDir (the only exec-allowed app location), so legacy packaging is required.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/libxray.so', '**/libsingbox.so']   // never strip Go binaries
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

// Fetch pinned native prerequisites (engines, hev-socks5-tunnel, zlib/mbedTLS/curl) before building.
// Skip with -PskipNativeDeps (e.g. when running only JVM unit tests).
if (!project.hasProperty('skipNativeDeps')) {
    def scriptsDir = file("${rootDir}/scripts")
    tasks.register('fetchNativeDeps', Exec) {
        commandLine 'bash', '-c',
            "'${scriptsDir}/fetch_engines.sh' && '${scriptsDir}/build_deps.sh' arm64-v8a && '${scriptsDir}/fetch_hev.sh'"
    }
    tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'fetchNativeDeps' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    testImplementation 'junit:junit:4.13.2'
}
