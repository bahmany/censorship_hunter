org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true

# Proxy configuration (auto-detected from environment, needed for Gradle's
# JVM which doesn't inherit system proxy env vars).
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=3104
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=3104
systemProp.http.nonProxyHosts=localhost|127.0.0.1

# The proxy does TLS interception with a custom CA. Trust it.
systemProp.javax.net.ssl.trustAll=true
systemProp.javax.net.ssl.allowUnsafeRenegotiation=true
